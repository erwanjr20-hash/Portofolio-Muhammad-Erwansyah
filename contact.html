  <style>
      .Contact {
        display: flex;
        justify-content: space-between;
      }
      .card-contact {
        background-color: #f7f9fc;
        border: 0.5px solid #ddd;
        padding: 40px;
        margin: 20px;
        border-radius: 16px;
        transition: 0.5s ease;
      }
      .card-contact h1 {
        color: #0f3460 ;
      }
      .kartu-kontak {
        margin-top: 20px;
        background-color: #fff;
        border: 0.5px solid #ddd;
        display: flex;
        align-items: center;
        padding-right: 130px;
        padding-top: 5px;
        padding-left: 10px;
        margin-bottom: 40px;
        border-radius: 16px;
        padding-bottom: 5px;
      }
      .kartu-logo i{
        font-size: 25px;
        color: white;
      }
      .kartu-logo {
        background-color: #378ADD;
        padding: 8px;
        border-radius: 25%;
      }
      .kartu-logo1 {
        font-size: 25px;
        color: white;
      }
      .kartu-logo1 {
        background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        padding: 8px;
        border-radius: 25%;
      }
      .kartu-teks {
        text-align: left;
        line-height: 0.5;
        padding: 5px;
      }
      .kartu-teks h3 {
      margin-left: 10px;
      color: #8888;
      }
      .kartu-teks p {
        font-size: 15px;
      }
      /* Pesan */
      .pesan {
        background-color: #f7f9fc;
        border: 0.5px solid #ddd;
        margin: 20px;
        width: 440px;
        text-align: left;
        padding: 20px;
        border-radius: 16px;
      }
      .pesan h1 {
        margin-top: 20px;
        margin-bottom: 10px;
        color: #0f3460;
      }
      .pesan1 input {
        border-radius: 12px;
        width: 400px;
        height: 40px;
        padding: 10px;
        margin-bottom: 30px;
        background: #fff;
        border: 0.5px solid #ddd;
        outline: none;
      }
      .pesan1 h3 {
        color: #378ADD;
      }
      .pesan1 textarea {
        height: 100px;
        width: 400px;
        padding: 10px;
        border-radius: 12px;
        background: #fff;
        border: 0.5px solid #ddd;
        outline: none;
        margin-bottom: 10px;
      }
      .pesan1 input:focus {
        border-color: #378ADD;
        box-shadow: 0 0 0 3px rgba(55,138,221,0.1);
      }
      .pesan1 textarea:focus {
        border-color: #378ADD;
        box-shadow: 0 0 0 3px rgba(55,138,221,0.1);
      }
      .btn button {
        background-color: #f7f9fc;
        border: 0.5px solid #ddd;
        width: 400px;
        height: 40px;
        font-size: 15px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: 0.5s ease;
      }
      .btn button i {
        font-size: 15px;
      }
      .btn button:active {
        transform: scale(0.97);
        background-color: #ddd;
      }
      .card-contact a {
        text-decoration: none;
        color: #000;
      }
      /* RESPONSIVE CONTACT */

@media screen and (max-width: 768px) {

    .Contact {
        display: flex;
        flex-direction: column;
        gap: 25px;
        width: 100%;
    }

    .card-contact {
        width: 100%;
        margin: 0;
        padding: 20px;
    }

    .kartu-kontak {
        width: 100%;
        padding: 10px;
        margin: 15px 0;
        gap: 10px;
    }

    .kartu-teks {
        line-height: 1.4;
        min-width: 0;
    }

    .kartu-teks h3 {
        margin-left: 5px;
        font-size: 14px;
    }

    .pesan {
        width: 100%;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
    }

    .pesan1 input,
    .pesan1 textarea {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
    }

    .btn button {
        width: 100%;
    }
}

@media screen and (max-width: 480px) {

    .card-contact,
    .pesan {
        padding: 15px;
    }

    .card-contact h1,
    .pesan h1 {
        font-size: 22px;
    }

    .pesan1 h3 {
        font-size: 15px;
    }
}
